name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test — Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/index.js src/scanner.js src/tui.js

      - name: Version flag
        run: node src/index.js --version

      - name: JSON output is valid array
        run: node src/index.js --json | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); const a=JSON.parse(d); if (!Array.isArray(a)) process.exit(1); console.log('OK:', a.length, 'services')"

      - name: JSON entries have required fields
        run: |
          node src/index.js --json | node -e "
            const d = require('fs').readFileSync('/dev/stdin','utf8');
            const a = JSON.parse(d);
            if (a.length === 0) { console.log('OK: no services running'); process.exit(0); }
            const required = ['port','processName','source','status'];
            const missing = required.filter(k => !(k in a[0]));
            if (missing.length) { console.error('Missing fields:', missing); process.exit(1); }
            console.log('OK: fields', required.join(', '));
          "

      - name: Install bats
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Run bats tests
        run: bats test/scope.bats

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck -qq
      - name: Lint install.sh (errors only)
        run: shellcheck --severity=error install.sh

  install-script:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh && echo "OK"
