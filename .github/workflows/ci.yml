name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version flag
        run: node src/index.js --version

      - name: Static scan (no TTY needed)
        run: node src/index.js 2>&1 | head -5 || true

      - name: Lint (no unused vars, no syntax errors)
        run: node --check src/index.js src/scanner.js src/tui.js

